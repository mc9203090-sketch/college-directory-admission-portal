
{% load static %}

<header class="riphah-header">
    <div class="riphah-logo-section">
        <div class="riphah-logo-container">
            <img
                src="{% static 'images/ripah logo.jfif' %}"
                alt="Riphah College Logo"
            >
        </div>

        <div class="riphah-college-text">
            <span>RIPAH</span>
            <span>College</span>
            <span>Chishtian</span>
        </div>
    </div>

    <button
        type="button"
        class="riphah-menu-toggle"
        id="riphah-menu-toggle"
        aria-label="Open navigation menu"
        aria-controls="riphah-navbar"
        aria-expanded="false"
    >
        <i class="fas fa-bars"></i>
    </button>

    <nav class="riphah-navbar" id="riphah-navbar">
        <a href="{% url 'index' %}">Home</a>

        <div class="riphah-dropdown">
            <a href="#" class="riphah-dropdown-toggle">
                ABOUT US <i class="fa fa-caret-down"></i>
            </a>
            <ul class="riphah-sub-menu">
                <li>
                    <a href="{% url 'historyrip' %}">About Riphah</a>
                </li>
                <li>
                    <a href="{% url 'missionrip' %}">
                        Mission Vision and Values
                    </a>
                </li>
            </ul>
        </div>

        <div class="riphah-dropdown">
            <a href="#" class="riphah-dropdown-toggle">
                ADMISSIONS <i class="fa fa-caret-down"></i>
            </a>
            <ul class="riphah-sub-menu">
                <li>
                    <a href="{% url 'feestructurerip' %}">
                        Fees Structure
                    </a>
                </li>
                <li>
                    <a href="{% url 'applyrip' %}">Apply</a>
                </li>
            </ul>
        </div>

        <div class="riphah-dropdown">
            <a href="{% url 'classrip' %}">FACILITIES</a>
        </div>

        <div class="riphah-dropdown">
            <a href="#" class="riphah-dropdown-toggle">
                LEARNING AT RIPAH <i class="fa fa-caret-down"></i>
            </a>
            <ul class="riphah-sub-menu">
                <li>
                    <a href="{% url 'spacerip' %}">
                        LEARNING AT RIPAH
                    </a>
                </li>
                <li>
                    <a href="{% url 'affiliaterip' %}">AFFILIATE</a>
                </li>
            </ul>
        </div>

        <a href="{% url 'contactrip' %}">CONTACT US</a>
    </nav>
</header>

<script>
(function () {
    const header = document.querySelector(".riphah-header");
    if (!header || header.dataset.menuInitialized === "true") return;
    header.dataset.menuInitialized = "true";

    const toggle = header.querySelector("#riphah-menu-toggle");
    const navbar = header.querySelector("#riphah-navbar");
    const dropdowns = header.querySelectorAll(".riphah-dropdown");

    if (!toggle || !navbar) return;

    function closeMenu() {
        navbar.classList.remove("riphah-active");
        toggle.setAttribute("aria-expanded", "false");

        dropdowns.forEach(function (dropdown) {
            dropdown.classList.remove("riphah-open");
        });
    }

    toggle.addEventListener("click", function () {
        const isOpen = navbar.classList.toggle("riphah-active");
        toggle.setAttribute("aria-expanded", String(isOpen));
    });

    dropdowns.forEach(function (dropdown) {
        const link = dropdown.querySelector(".riphah-dropdown-toggle");
        if (!link) return;

        link.addEventListener("click", function (event) {
            if (window.innerWidth > 767 || link.getAttribute("href") !== "#") {
                return;
            }

            event.preventDefault();

            const wasOpen = dropdown.classList.contains("riphah-open");

            dropdowns.forEach(function (item) {
                item.classList.remove("riphah-open");
            });

            if (!wasOpen) {
                dropdown.classList.add("riphah-open");
            }
        });
    });

    navbar.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
            if (
                window.innerWidth <= 767 &&
                link.getAttribute("href") !== "#"
            ) {
                closeMenu();
            }
        });
    });

    window.addEventListener("resize", function () {
        if (window.innerWidth > 767) {
            closeMenu();
        }
    });
})();
</script>
