{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Riphah College Chishtian{% endblock %}</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="{% static 'css/riphah-common.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'riphah/components/riphah-navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'riphah/components/riphah-footer.html' %}

    <script src="{% static 'riphah-common.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
