<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Your Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .reset-container {
            width: 100%;
            max-width: 520px;
            margin: 65px 20px 40px;
            text-align: center;
        }

        /* Password reset icon */

        .reset-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-icon svg {
            width: 100%;
            height: 100%;
        }

        /* Heading */

        h1 {
            font-size: 27px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 25px;
            color: #111111;
        }

        .subtitle {
            font-size: 16px;
            color: #555555;
            margin-bottom: 32px;
        }

        /* Django messages */

        .messages {
            margin-bottom: 20px;
            text-align: left;
        }

        .message {
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 10px;
            overflow-wrap: anywhere;
        }

        .message.success {
            background: #e8f7ed;
            color: #176b35;
        }

        .message.error {
            background: #fff0f0;
            color: #b42318;
        }

        .message.warning {
            background: #fff7e5;
            color: #805b00;
        }

        .message.info {
            background: #eef4ff;
            color: #234b91;
        }

        /* Form */

        .reset-form {
            width: 100%;
        }

        .email-field {
            height: 76px;
            width: 100%;
            border: 2px solid #dadde1;
            border-radius: 26px;
            display: flex;
            align-items: center;
            padding: 0 22px;
            margin-bottom: 34px;
            transition: border-color 0.2s ease;
            background: #ffffff;
        }

        .email-field:focus-within {
            border-color: #5265ff;
        }

        .email-field svg {
            width: 27px;
            height: 27px;
            flex-shrink: 0;
            margin-right: 17px;
            color: #62676b;
        }

        .email-field input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 17px;
            color: #222222;
            font-family: inherit;
            min-width: 0;
        }

        .email-field input::placeholder {
            color: #85898d;
            opacity: 1;
        }

        /* Red button */

        .submit-btn {
            width: 100%;
            min-height: 64px;
            border: none;
            border-radius: 35px;
            background: #e60023;
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease,
                        transform 0.2s ease;
        }

        .submit-btn:hover {
            background: #bd001c;
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        /* Back to login */

        .back-link {
            display: inline-block;
            margin-top: 40px;
            font-size: 17px;
            color: #353b91;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Mobile responsive design */

        @media (max-width: 600px) {
            .reset-container {
                max-width: 100%;
                margin: 55px 22px 30px;
            }

            .reset-icon {
                width: 85px;
                height: 85px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 15px;
                margin-bottom: 27px;
            }

            .email-field {
                height: 62px;
                border-radius: 22px;
                padding: 0 16px;
                margin-bottom: 25px;
            }

            .email-field input {
                font-size: 15px;
            }

            .submit-btn {
                min-height: 56px;
                font-size: 15px;
            }

            .back-link {
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>

    <main class="reset-container">

        <!-- Password Reset Illustration -->
        <div class="reset-icon" aria-hidden="true">

            <svg viewBox="0 0 100 100" fill="none"
                 xmlns="http://www.w3.org/2000/svg">

                <!-- Small decorative lines -->
                <path d="M16 25 L9 19"
                      stroke="#FF927D" stroke-width="4"
                      stroke-linecap="round"/>

                <path d="M12 39 L4 39"
                      stroke="#FF927D" stroke-width="4"
                      stroke-linecap="round"/>

                <path d="M84 25 L91 19"
                      stroke="#FF927D" stroke-width="4"
                      stroke-linecap="round"/>

                <path d="M88 39 L96 39"
                      stroke="#FF927D" stroke-width="4"
                      stroke-linecap="round"/>

                <!-- Envelope -->
                <rect x="9" y="44" width="82" height="47"
                      rx="9" fill="#EF4936"/>

                <path d="M10 49 L50 76 L90 49"
                      fill="#FF765D"/>

                <path d="M10 85 L37 62 L50 72 L63 62 L90 85"
                      fill="#E83D2C"/>

                <!-- Letter -->
                <rect x="25" y="16" width="50" height="51"
                      rx="10" fill="#FFF0EC"/>

                <!-- Lock shackle -->
                <path d="M42 36 V31
                         C42 20 58 20 58 31 V36"
                      stroke="#C91F2B" stroke-width="4"
                      stroke-linecap="round"/>

                <!-- Lock body -->
                <rect x="36" y="34" width="28" height="25"
                      rx="5" fill="#E60023"/>

                <!-- Keyhole -->
                <circle cx="50" cy="44" r="3"
                        fill="#FFFFFF"/>

                <path d="M50 46 V51"
                      stroke="#FFFFFF" stroke-width="3"
                      stroke-linecap="round"/>

            </svg>

        </div>

        <h1>Reset your password</h1>

        <p class="subtitle">Enter your email.</p>

        <!-- Django Messages -->
        {% if messages %}
            <div class="messages" aria-live="polite">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Password Reset Form -->
        <form method="post" class="reset-form">
            {% csrf_token %}

            <div class="email-field">

                <!-- Email Icon -->
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     aria-hidden="true">

                    <rect x="3" y="5" width="18" height="14"
                          rx="2"/>

                    <path d="M3 7 L12 13 L21 7"/>

                </svg>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    maxlength="254"
                    required
                >

            </div>

            <button type="submit" class="submit-btn">
                Send password reset code
            </button>

        </form>

        <a href="{% url 'login' %}?mode=login" class="back-link">
            Back to login
        </a>

    </main>

</body>
</html>
