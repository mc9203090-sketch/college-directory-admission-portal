
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333333;
        }

        .otp-container {
            width: 100%;
            max-width: 650px;
            padding: 35px 24px;
            text-align: center;
        }

        h1 {
            color: #673675;
            font-size: 36px;
            margin-bottom: 28px;
        }

        .description {
            font-size: 20px;
            line-height: 1.6;
            color: #555555;
            margin-bottom: 65px;
            overflow-wrap: anywhere;
        }

        .otp-inputs {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 65px;
        }

        .otp-inputs input {
            width: 65px;
            height: 65px;
            border: none;
            border-bottom: 5px solid #cccccc;
            border-radius: 0;
            outline: none;
            background: white;
            text-align: center;
            font-size: 28px;
            color: #c82f1c;
        }

        .otp-inputs input:focus {
            border-bottom-color: #c82f1c;
        }

        .resend-text {
            font-size: 19px;
            margin-bottom: 65px;
        }

        .resend-text button {
            background: none;
            border: none;
            color: #c82f1c;
            text-decoration: underline;
            font-size: inherit;
            cursor: pointer;
        }

        .verify-btn {
            width: 90%;
            min-height: 70px;
            border: none;
            border-radius: 35px;
            background: #c82f1c;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px #00000015;
        }

        .verify-btn:hover {
            background: #6b1206e8;
        }

        .messages {
            margin-bottom: 25px;
        }

        .message {
            margin: 8px 0;
            padding: 12px;
            border-radius: 8px;
            background: #fff0f0;
            color: #a51d2d;
            overflow-wrap: anywhere;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 28px;
            }

            .description {
                font-size: 16px;
                margin-bottom: 45px;
            }

            .otp-inputs {
                gap: 7px;
                margin-bottom: 45px;
            }

            .otp-inputs input {
                width: 13%;
                min-width: 0;
                height: 52px;
                font-size: 22px;
            }

            .resend-text {
                font-size: 16px;
                margin-bottom: 45px;
            }

            .verify-btn {
                min-height: 68px;
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="otp-container">
        <h1>Please Enter OTP</h1>

        <p class="description">
            Your One Time Password (OTP) has been sent via email
            to your registered email address.
        </p>

        {% if messages %}
            <div class="messages" aria-live="polite">
                {% for message in messages %}
                    <p class="message">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" id="otp-form">
            {% csrf_token %}

            <input type="hidden" name="otp" id="otp-value">

            <div class="otp-inputs">
                {% for i in "123456" %}
                    <input
                        type="text"
                        inputmode="numeric"
                        pattern="[0-9]"
                        maxlength="1"
                        aria-label="OTP digit {{ forloop.counter }}"
                        autocomplete="one-time-code"
                        required
                    >
                {% endfor %}
            </div>

            <p class="resend-text">
                Did not receive OTP?
                <button
                    type="submit"
                    formaction="{% url 'resend-reset-otp' %}"
                    formmethod="post"
                    formnovalidate>
                    Resend
                </button>
            </p>

            <button type="submit" class="verify-btn">
                Verify
            </button>
        </form>
    </main>

    <script>
        const boxes = [...document.querySelectorAll(".otp-inputs input")];

        boxes.forEach((box, index) => {
            box.addEventListener("input", () => {
                box.value = box.value.replace(/\D/g, "").slice(-1);

                if (box.value && index < boxes.length - 1) {
                    boxes[index + 1].focus();
                }
            });

            box.addEventListener("keydown", event => {
                if (event.key === "Backspace" && !box.value && index > 0) {
                    boxes[index - 1].focus();
                }
            });

            box.addEventListener("paste", event => {
                event.preventDefault();
                const digits = event.clipboardData
                    .getData("text")
                    .replace(/\D/g, "")
                    .slice(0, 6);

                digits.split("").forEach((digit, i) => {
                    boxes[i].value = digit;
                });

                boxes[Math.min(digits.length, 5)].focus();
            });
        });

        document.getElementById("otp-form").addEventListener("submit", event => {
            if (event.submitter?.hasAttribute("formaction")) return;

            const otp = boxes.map(box => box.value).join("");
            document.getElementById("otp-value").value = otp;

            if (!/^\d{6}$/.test(otp)) {
                event.preventDefault();
                alert("Please enter the complete 6-digit OTP.");
            }
        });
    </script>
</body>
</html>
