{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 600px;
            max-width: calc(100% - 40px);
            margin: 80px auto;
            background: white;
            padding: 40px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            border-radius: 6px;
        }


        /* =========================
           LOGO / COLLEGE NAME
        ========================= */

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h1 {
            color: #E13B23;
            font-size: 30px;
            margin: 0;
            line-height: 1.3;
        }


        /* =========================
           TITLE
        ========================= */

        .title {
            color: #ff6a00;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.4;
        }


        /* =========================
           PARAGRAPH
        ========================= */

        .description {
            color: #444;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 25px;
        }


        /* =========================
           FORM
        ========================= */

        form {
            width: 100%;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }


        /* EMAIL INPUT */

        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin: 0 0 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
        }

        input[type="email"]:focus {
            border-color: #E13B23;
        }


        /* CHECKBOX */

        .consent {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-weight: normal;
            line-height: 1.5;
            cursor: pointer;
        }

        .consent input[type="checkbox"] {
            width: 17px;
            height: 17px;
            margin: 2px 0 0;
            flex-shrink: 0;
            cursor: pointer;
        }


        /* =========================
           BUTTON
        ========================= */

        button {
            background: #ff6a00;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.3s;
        }

        button:hover {
            background: #E13B23;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 767px) {

            .container {
                width: 100%;
                max-width: calc(100% - 30px);
                margin: 30px auto;
                padding: 25px 20px;
            }

            .logo h1 {
                font-size: 23px;
            }

            .title {
                font-size: 20px;
                margin-bottom: 15px;
            }

            .description {
                font-size: 15px;
                line-height: 1.6;
            }

            label {
                font-size: 14px;
            }

            input[type="email"] {
                padding: 11px;
            }

            button {
                width: 100%;
                padding: 13px;
            }

        }


        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 400px) {

            .container {
                max-width: calc(100% - 20px);
                margin: 20px auto;
                padding: 22px 16px;
            }

            .logo h1 {
                font-size: 20px;
            }

            .title {
                font-size: 18px;
            }

            .description {
                font-size: 14px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- COLLEGE NAME -->

        <div class="logo">

            <h1>
                PUNJAB COLLEGE CHISHTIAN
            </h1>

        </div>


        <!-- TITLE -->

        <div class="title">

            Stay Connected with News *&* Events

        </div>


        <!-- DESCRIPTION -->

        <p class="description">

            News *&* Events is a free online newsletter that brings the latest
            from campus right to your inbox.

        </p>


        <!-- SIGNUP FORM -->

        <form action="confirm pgc.html">


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >


            <!-- CONSENT -->

            <label class="consent">

                <input
                    type="checkbox"
                    name="consent"
                    required
                >

                <span>
                    I consent to receiving email communications
                </span>

            </label>


            <br>


            <!-- SUBMIT -->

            <button type="submit">
                Submit
            </button>


        </form>


    </div>


</body>

</html>
