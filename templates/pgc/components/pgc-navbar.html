
{% load static %}

<header class="pgc-header">

    <div class="pgc-logo-section">
        <div class="pgc-logo-container">
            <img src="{% static 'images/pgc logo.png' %}"
                 alt="Punjab College Logo">
        </div>

        <div class="pgc-college-text">
            <span>Punjab</span>
            <span>College</span>
            <span>Chishtian</span>
        </div>
    </div>

    <button class="pgc-menu-toggle"
            id="pgc-menu-toggle"
            type="button"
            aria-label="Toggle navigation"
            aria-expanded="false">
        <i class="fas fa-bars"></i>
    </button>
<nav class="navbar" id="navbar">
    <a href="{% url 'index' %}">Home</a>

    <div class="dropdown">
        <a href="#">ABOUT US <i class="fa fa-caret-down"></i></a>
        <ul class="sub-menu">
            <li><a href="{% url 'historypgc' %}">About PGC</a></li>
            <li><a href="{% url 'uniquelypgc' %}">Uniquely PGC</a></li>
            <li><a href="{% url 'missionpgc' %}">Mission, Vision, Goals</a></li>
        </ul>
    </div>

    <div class="dropdown">
        <a href="#">ADMISSIONS <i class="fa fa-caret-down"></i></a>
        <ul class="sub-menu">
            <li><a href="{% url 'undergraduatepgc' %}">Undergraduate Programmes</a></li>
            <li><a href="{% url 'feepgc' %}">Scholarship &amp; Fee Concession</a></li>
            <li><a href="{% url 'applypgc' %}">Apply</a></li>
        </ul>
    </div>

    <a href="{% url 'activitypgc' %}">Activities</a>

    <div class="dropdown">
        <a href="#">LEARNING AT PUNJAB <i class="fa fa-caret-down"></i></a>
        <ul class="sub-menu">
            <li><a href="{% url 'blogpgc' %}">Blogs PGC</a></li>
            <li><a href="{% url 'careerpgc' %}">Careers</a></li>
            <li><a href="{% url 'affiliatepgc' %}">Affiliate</a></li>
        </ul>
    </div>

    <a href="{% url 'contactpgc' %}">CONTACT US</a>
</nav>

</header>

<script>
(function () {
    const menuToggle = document.getElementById("pgc-menu-toggle");
    const navbar = document.getElementById("pgc-navbar");

    if (!menuToggle || !navbar) return;

    menuToggle.addEventListener("click", function () {
        const isOpen = navbar.classList.toggle("active");
        menuToggle.setAttribute("aria-expanded", String(isOpen));
        menuToggle.innerHTML = isOpen
            ? '<i class="fas fa-times"></i>'
            : '<i class="fas fa-bars"></i>';
    });

    navbar.querySelectorAll(".pgc-dropdown-toggle").forEach(function (link) {
        link.addEventListener("click", function (event) {
            if (window.innerWidth <= 767) {
                event.preventDefault();

                const dropdown = this.parentElement;

                navbar.querySelectorAll(".pgc-dropdown").forEach(function (item) {
                    if (item !== dropdown) item.classList.remove("open");
                });

                dropdown.classList.toggle("open");
            }
        });
    });

    navbar.querySelectorAll("a:not(.pgc-dropdown-toggle), .pgc-sub-menu a")
        .forEach(function (link) {
            link.addEventListener("click", function () {
                if (window.innerWidth <= 767) {
                    navbar.classList.remove("active");
                    menuToggle.setAttribute("aria-expanded", "false");
                    menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
                }
            });
        });

    window.addEventListener("resize", function () {
        if (window.innerWidth > 767) {
            navbar.classList.remove("active");
            navbar.querySelectorAll(".pgc-dropdown").forEach(function (item) {
                item.classList.remove("open");
            });
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
        }
    });
})();
</script>
