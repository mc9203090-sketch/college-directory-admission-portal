
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chishtian Science College{% endblock %}</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/csc-common.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body id="top">
    {% include 'components/csc-navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'components/csc-footer.html' %}

    <a href="#top" id="back-to-top" aria-label="Back to top">
        Back to Top <i class="fas fa-chevron-up"></i>
    </a>

    <script src="{% static 'js/csc-common.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
