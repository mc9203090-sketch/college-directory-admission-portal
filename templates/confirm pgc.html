{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Success - Punjab Colleges</title>

<style>

    *{
        box-sizing:border-box;
    }

    html{
        scroll-behavior:smooth;
    }

    body{
        margin:0;
        padding:0;
        min-height:100vh;
        font-family:Arial, sans-serif;
        background:#f3f3f5;
        display:flex;
        justify-content:center;
        align-items:center;
        color:#2e2c6a;
    }

    .success-container{
        width:90%;
        max-width:650px;
        background:white;
        padding:55px 45px;
        border-radius:12px;
        text-align:center;
        box-shadow:0 8px 30px rgba(0,0,0,0.12);
    }

    .success-icon{
        width:75px;
        height:75px;
        margin:0 auto 25px;
        border-radius:50%;
        background:#E13B23;
        color:white;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:36px;
        font-weight:bold;
    }

    h1{
        margin:0 0 20px;
        color:#E13B23;
        font-size:38px;
    }

    p{
        margin:0 auto;
        max-width:520px;
        font-size:18px;
        line-height:1.7;
        color:#555;
    }

    .home-btn{
        display:inline-block;
        margin-top:30px;
        padding:13px 28px;
        background:#2e2c6a;
        color:white;
        text-decoration:none;
        border-radius:6px;
        font-weight:bold;
        transition:0.3s;
    }

    .home-btn:hover{
        background:#E13B23;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:600px){

        body{
            padding:20px;
        }

        .success-container{
            width:100%;
            padding:40px 25px;
        }

        .success-icon{
            width:65px;
            height:65px;
            font-size:30px;
            margin-bottom:20px;
        }

        h1{
            font-size:30px;
            margin-bottom:15px;
        }

        p{
            font-size:16px;
            line-height:1.6;
        }

        .home-btn{
            width:100%;
            padding:13px 20px;
        }

    }

</style>
</head>
<body>
<div class="success-container">
    <div class="success-icon">
        ✓
    </div>
    <h1>You’re All Set!</h1>
    <p>
        Thank you for joining our News and Events community.
        A confirmation email is on its way to your inbox.
    </p>
    <a href="{% url 'index' %}" class="home-btn">
        BACK TO HOME
    </a>
</div>
</body>
</html>
