{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | College Directory</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #2e2c6a;
        }

        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: linear-gradient(
                135deg,
                #f5f5f5 0%,
                #ffffff 50%,
                #eeeeee 100%
            );
        }

        .error-container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            background: white;
            padding: 55px 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .error-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        .error-code {
            font-size: 110px;
            font-weight: bold;
            line-height: 1;
            color: #E13B23;
            margin: 0;
        }

        .error-title {
            font-size: 32px;
            margin: 20px 0 12px;
            color: #2e2c6a;
        }

        .error-text {
            font-size: 17px;
            line-height: 1.7;
            color: #666;
            margin: 0 auto 30px;
            max-width: 500px;
        }

        .home-btn {
            display: inline-block;
            padding: 14px 30px;
            background: #E13B23;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #c92f1c;
            transform: translateY(-2px);
        }

        .college-name {
            margin-top: 30px;
            font-size: 14px;
            color: #888;
        }

        @media (max-width: 600px) {

            .error-page {
                padding: 20px 15px;
            }

            .error-container {
                padding: 45px 22px;
            }

            .error-icon {
                font-size: 55px;
            }

            .error-code {
                font-size: 80px;
            }

            .error-title {
                font-size: 25px;
            }

            .error-text {
                font-size: 15px;
            }

            .home-btn {
                width: 100%;
                max-width: 280px;
            }
        }

        @media (max-width: 380px) {

            .error-code {
                font-size: 70px;
            }

            .error-title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <main class="error-page">

        <div class="error-container">

            <div class="error-icon">
                🎓
            </div>

            <h1 class="error-code">
                404
            </h1>

            <h2 class="error-title">
                Page Not Found
            </h2>

            <p class="error-text">
                Sorry, the page you are looking for does not exist
                or may have been moved to another location.
            </p>

            <a href="{% url 'index' %}" class="home-btn">
                ← Back to Home
            </a>

            <p class="college-name">
                College Directory
            </p>

        </div>

    </main>

</body>
</html>
