{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admissions</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        width: 350px;
        max-width: 100%;
        background: white;
        padding: 25px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
        text-align: center;
        margin: 0 0 20px;
        color: #2e2c6a;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        outline: none;
    }

    input:focus {
        border-color: #2e2c6a;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        background: #E13B23;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #2e2c6a;
    }

    .link {
        text-align: center;
        margin-top: 15px;
    }

    .link a {
        color: #2e2c6a;
        text-decoration: none;
        cursor: pointer;
        font-size: 14px;
    }

    .link a:hover {
        text-decoration: underline;
    }

    .message {
        text-align: center;
        margin-bottom: 15px;
        color: #E13B23;
        font-size: 14px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 480px) {

        body {
            padding: 15px;
        }

        .container {
            width: 100%;
            padding: 22px 18px;
        }

        h2 {
            font-size: 22px;
        }

        input {
            padding: 11px;
            font-size: 14px;
        }

        button {
            padding: 12px;
            font-size: 15px;
        }
    }

    @media (max-width: 350px) {

        body {
            padding: 10px;
        }

        .container {
            padding: 18px 14px;
        }

        h2 {
            font-size: 20px;
        }
    }
</style>

</head>

<body>

<!-- ================= SIGN UP ================= -->

<div class="container" id="signup">

<h2>College Admissions</h2>

{% if messages %}
    {% for message in messages %}
        <div class="message">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST" action="{% url 'application-form' %}">

    {% csrf_token %}

    <input
        type="text"
        name="user_id"
        placeholder="User ID"
        required
    >

    <input
        type="email"
        name="email"
        placeholder="Email"
        required
    >

    <input
        type="tel"
        name="mobile"
        placeholder="Mobile Number (11 digits)"
        required
        minlength="11"
        maxlength="11"
        pattern="[0-9]{11}"
        inputmode="numeric"
        title="Please enter exactly 11 digits."
    >

    <input
        type="text"
        name="full_name"
        placeholder="Full Name"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <input
        type="password"
        name="confirm_password"
        placeholder="Confirm Password"
        required
    >

    <button type="submit">
        Sign up
    </button>

</form>

<div class="link">
    <a onclick="showLogin()">
        Already have an account?
    </a>
</div>

</div>

<!-- ================= LOGIN ================= -->

<div class="container" id="login" style="display:none;">

<h2>Login</h2>

<form method="POST" action="{% url 'application-form' %}">

    {% csrf_token %}

    <input
        type="text"
        name="user_id"
        placeholder="User ID"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Sign In
    </button>

</form>

<div class="link">
    <a onclick="showSignup()">
        Create new account
    </a>
</div>


</div>

<!-- ================= JAVASCRIPT ================= -->

<script>

    function showLogin() {

        document.getElementById("signup").style.display = "none";

        document.getElementById("login").style.display = "block";

    }


    function showSignup() {

        document.getElementById("login").style.display = "none";

        document.getElementById("signup").style.display = "block";

    }

</script>

</body>
</html>
